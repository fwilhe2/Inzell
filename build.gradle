plugins {
    id 'org.jetbrains.kotlin.multiplatform' version '2.0.21'
    id 'maven-publish'
}

group 'com.github.fwilhe.inzell'
version System.getenv("VERSION") ?: '0.0.3.norelease'

repositories {
    mavenCentral()
}

kotlin {
    jvmToolchain(17)
    jvm()
    js(IR) {
        nodejs()
        browser()
    }

    sourceSets {
        commonMain {
            dependencies {}
        }

        commonTest {
            dependencies {
                implementation kotlin('test')
            }
        }
    }
}

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/fwilhe2/Inzell")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
                password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
            }
        }
    }

}
