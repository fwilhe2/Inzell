import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'org.jetbrains.kotlin.multiplatform' version '2.4.10'
    id 'maven-publish'
}

group 'com.github.fwilhe.inzell'
version System.getenv("VERSION") ?: '0.0.3.norelease'

repositories {
    mavenCentral()
}

kotlin {
    jvmToolchain(25)
    jvm()
    js(IR) {
        nodejs()
        browser()
    }

    sourceSets {
        commonMain {
            dependencies {}
        }

        commonTest {
            dependencies {
                implementation kotlin('test')
            }
        }
    }
}

tasks.named("rootPackageJson") {
    doLast {
        def packageFile = file("$buildDir/js/package.json")
        def packageJson = new JsonSlurper().parse(packageFile)
        packageJson.resolutions = [
            "**/diff": "8.0.4",
            "**/socket.io-parser": "4.2.7",
            "**/brace-expansion": "1.1.18",
            "**/body-parser": "1.20.6",
            "**/ws": "8.21.3",
            "**/tmp": "0.2.7",
            "**/serialize-javascript": "7.1.0",
            "**/follow-redirects": "1.16.0",
            "**/lodash": "4.18.1",
            "**/picomatch": "2.3.2",
            "**/flatted": "3.4.4",
            "**/qs": "6.15.3",
            "**/minimatch": "3.1.4",
            "**/webpack": "5.109.2",
            "**/cross-spawn": "7.0.5",
            "**/braces": "3.0.3"
        ]
        packageFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(packageJson))
    }
}

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/fwilhe2/Inzell")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
                password = project.findProperty("gpr.key") ?: System.getenv("TOKEN")
            }
        }
    }

}
